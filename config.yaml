      BMB: 0.15
      LMB: 0.1
      OL: 0.05
      OLJ: 0.05
      LŁ: 0.05
    sezon: {6: 1, 7: 1, 8: 1, 9: 1}

# --- Wykluczenia („niedostępne”) ----------------------------------------------
wykluczenia:
  # Kolejność sekcji = priorytet, gdy wydzielenie spełnia kilka warunków.
  # funkcja lasu (f_subarea.forest_func_cd) -> opis. Uproszczenie: zakładamy, że
  # w każdym rezerwacie obowiązuje zakaz zbioru grzybów (art. 15 ustawy o ochronie
  # przyrody), choć plan ochrony może zbiór dopuszczać.
  funkcje_lasu:
    REZ: rezerwat przyrody – zakładany zakaz zbioru (sprawdź plan ochrony)
    REZ CZ: rezerwat częściowy – zakładany zakaz zbioru (sprawdź plan ochrony)
    REZ Ś: rezerwat ścisły – zakaz zbioru
  # kategoria ochronności (f_arod_category.prot_category_cd) -> opis.
  # Art. 26 ust. 2 ustawy o lasach – stały zakaz wstępu do: 1) upraw do 4 m,
  # 2) powierzchni doświadczalnych i drzewostanów nasiennych, 3) ostoi zwierząt,
  # 4) źródlisk rzek i potoków, 5) obszarów zagrożonych erozją. Pkt 4–5 nie mają
  # odpowiednika w BDL (OCH GLEB to las glebochronny – tylko ostrzeżenie niżej).
  kategorie_ochronnosci:
    OCH OSTOJ: ostoja zwierząt – stały zakaz wstępu
    OCH NAS: drzewostan nasienny – stały zakaz wstępu
    OCH BADAW: powierzchnia badawcza/doświadczalna – stały zakaz wstępu
  # rodzaj powierzchni (f_subarea.area_type_cd) -> opis
  rodzaje_powierzchni:
    PLANT NAS: plantacja nasienna – zakaz wstępu (baza nasienna, zwykle ogrodzona)
    SZK LEŚNA: szkółka leśna – teren ogrodzony
  # Uprawa: średnia wysokość piętra górnego (pietra_gorne) ważona udziałami <= próg.
  # Gatunkom młodszym niż uprawa_max_wiek_lat bez wysokości w BDL przypisujemy
  # uprawa_wysokosc_brak_m. Gdy w ogóle brak wysokości – wiek gatunku panującego < próg wieku.
  uprawa_max_wysokosc_m: 4
  uprawa_max_wiek_lat: 10
  uprawa_wysokosc_brak_m: 1.0
  # Powierzchnie nieleśne: rodzaj powierzchni z flagą type_fl = 'N' w słowniku
  # f_area_type_dic (grunty rolne, wody, zabudowa, bagna, zadrzewienia...).
  nielesne_flaga: N

# Kategorie ochronności pokazywane w popupie jako ostrzeżenie (bez wykluczania).
ostrzezenia:
  OCH OBR: las obronny – możliwy teren wojskowy/poligon; sprawdź zasady wstępu
  OCH GLEB: las glebochronny – fragmenty mogą być oznakowane jako obszar zagrożony erozją (zakaz wstępu)

# --- Pogoda (Open-Meteo) -----------------------------------------------------
pogoda:
  url: https://api.open-meteo.com/v1/forecast
  siatka_km: 5                   # zmiana wymaga pełnego przeliczenia (nix run .#mapa)
  dni_wstecz: 30
  dni_prognozy: 7
  horyzonty_dni: [0, 3, 7]       # dziś, +3, +7
  strefa_czasowa: Europe/Warsaw
  # Zmienne Open-Meteo (nazwy z https://open-meteo.com/en/docs)
  zmienne_dzienne: [precipitation_sum, temperature_2m_min, temperature_2m_mean]
  wilgotnosc_gleby: soil_moisture_3_to_9cm   # zmienna godzinowa, uśredniana do doby; null = wyłącz
  punktow_na_zapytanie: 50
  limit_wywolan_na_minute: 550   # darmowe API: 600/min, 5000/h, 10000/dobę
  cache_godzin: 3                # ponowne uruchomienie w tym czasie nie pobiera danych

  opady:
    okno_dni: 14
    krzywa_mm: [[0, 0.0], [15, 0.25], [40, 1.0]]   # <15 mm słabo, 15–40 rośnie, >40 pełna
    # Wysyp zwykle 7–14 dni po obfitym deszczu: premia, jeśli w tym oknie
    # suma z `okno_zdarzenia_dni` kolejnych dni przekroczyła próg.
    wysyp_opoznienie_dni: [7, 14]   # całe zdarzenie musi się mieścić w tym przedziale
    wysyp_okno_zdarzenia_dni: 2
    wysyp_prog_mm: 15
    wysyp_premia: 0.15
  gleba:
    waga: 0.3                       # udział wilgotności gleby w czynniku wilgoci
    krzywa_m3m3: [[0.10, 0.0], [0.20, 0.6], [0.30, 1.0]]
  temperatura:
    okno_dni: 7
    krzywa_c: [[0, 0.0], [5, 0.15], [10, 1.0], [20, 1.0], [25, 0.15], [30, 0.0]]
  przymrozek:
    prog_c: -1.0                    # Tmin poniżej progu...
    okno_dni: 5                     # ...w ostatnich N dniach
    mnoznik: 0.25

# --- GBIF (weryfikacja) ------------------------------------------------------
gbif:
  url: https://api.gbif.org/v1
  bufor_km: 10                 # zasięg wyszukiwania wokół nadleśnictw
  max_na_takson: 3000
  max_niepewnosc_m: 1000       # obserwacje z większą niepewnością położenia pomijane (statystyki i mapa)
  dopasowanie_m: 200           # punkt poza wydzieleniem: weź najbliższe wydzielenie leśne w tym promieniu
  prog_wysoki: 0.5             # „wysoki potencjał siedliskowy”
  min_proba: 10                # poniżej tylu dopasowanych obserwacji raport ustawia flagę mala_proba

# --- Mapa --------------------------------------------------------------------
mapa:
  plik: mapa.html
  uproszczenie_m: 4            # tolerancja upraszczania geometrii (EPSG:2180)
  precyzja: 5                  # miejsca po przecinku w EPSG:4326 (1e-5° ≈ 1 m)
  min_pole_m2: 50              # pomijaj okruchy geometrii po uproszczeniu
  # Skala sekwencyjna (jeden odcień, jasny -> ciemny) dla potencjał × pogoda (0–1).
  # Pomarańcz/brąz zamiast zieleni, żeby nie zlewała się z lasami na podkładzie OSM.
  skala: [[0.0, "#fff5eb"], [0.1, "#fdd0a2"], [0.25, "#fdae6b"], [0.4, "#fd8d3c"], [0.6, "#e6550d"], [0.8, "#a63603"]]
  # Podkład (OSM). Biblioteka MapLibre GL ładowana z CDN.
  podklad_url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  podklad_atrybucja: "© <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a>"
  maplibre_wersja: 4.7.1
