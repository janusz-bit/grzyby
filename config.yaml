# Wszystkie progi i reguły modelu. Po zmianie:
#   nix run .#mapa     – pełne przeliczenie (siedliska + pogoda + GBIF + mapa)
#   nix run .#pogoda   – tylko pogoda i mapa (wystarczy po zmianie sekcji `pogoda` – poza
#                        `siatka_km` – albo `sezon` gatunków)
#
# Krzywe zapisane jako lista punktów [x, y] są interpolowane liniowo,
# a poza zakresem przyjmują wartość skrajnego punktu.

dane:
  bdl_lista: dane.txt            # linki do paczek BDL (jeden zip = jedno nadleśnictwo)
  katalog_surowe: data/raw
  katalog_robocze: data/work
  katalog_wyniki: output
  crs: EPSG:2180                 # ETRS89 / Poland CS92 – zgodne z .prj w paczkach BDL
  kodowanie_txt: [utf-8, cp1250] # próbowane po kolei; paczki 2026 są w UTF-8

# --- Skład drzewostanu -------------------------------------------------------
drzewostan:
  # Waga piętra przy liczeniu udziału żywiciela. Udziały w obrębie piętra sumują
  # się do 10/10 (poza PRZES – niżej); piętra niewymienione (podszyt, nalot,
  # zakrzewienia) są pomijane.
  wagi_pieter:
    DRZEW: 1.0     # warstwa drzew (drzewostan jednopiętrowy)
    IP: 1.0        # piętro pierwsze
    IIP: 0.6       # piętro drugie
    PRZES: 0.3     # przestoje i nasienniki
    PODRII: 0.3    # podrost o charakterze II piętra
    PODR: 0.15     # podrost
  udzial_mjs: 0.03 # kod MJS – „miejscami”, poniżej 5%
  udzial_pjd: 0.02 # kod PJD – „pojedynczo”, poniżej 5%
  # Piętro PRZES (przestoje, nasienniki) w BDL nie ma kodów udziału. Udział gatunku
  # liczymy z jego miąższości: miąższość / miąższość pełnego drzewostanu (mediana
  # przestojów to ~8 m³/ha, czyli ~3%). Gdy brak miąższości – stała wartość.
  udzial_przestoje:
    miazszosc_pelna_m3ha: 300
    brak_miazszosci: 0.03
  # Piętra, w których obecność żywiciela (nawet MJS/PJD) liczy się jako „domieszka”
  # dla gatunków z parametrem `min_obecnosc`.
  pietra_domieszki: [DRZEW, IP, IIP]
  # Piętro górne – z niego liczony jest wiek/gatunek panujący i wysokość do reguły uprawy.
  pietra_gorne: [DRZEW, IP]
  czynnik_wieku_brak: 0.5  # gdy BDL nie podaje wieku gatunku

# Czynnik siedliska, gdy kodu siedliska nie ma w tabeli danego gatunku grzyba.
domyslny_czynnik_siedliska: 0.4

# --- Gatunki grzybów ---------------------------------------------------------
# zywiciele:  kod gatunku drzewa z BDL -> waga (0–1). Najpierw szukany jest pełny
#             kod (np. DB.C), potem rodzaj przed kropką (DB.S -> DB).
# nasycenie:  ważony udział żywicieli (0–1), przy którym czynnik udziału = 1;
#             mała wartość = wystarczy domieszka.
# min_obecnosc: (opcjonalnie) reguła „także jako domieszka”: gdy żywiciel występuje
#             w piętrach `pietra_domieszki` choćby pojedynczo (MJS/PJD), czynnik udziału
#             wynosi co najmniej min_obecnosc × waga tego żywiciela (np. TP 0,5 → 0,2).
# wiek:       krzywa [wiek_lat, czynnik] liczona dla wieku konkretnego żywiciela;
#             mnoży czynnik udziału (czysty drzewostan żywiciela = sama krzywa wieku).
# siedliska:  kod typu siedliskowego -> czynnik (0–1).
# sezon:      miesiąc -> czynnik; brak miesiąca = poza sezonem (0).
gatunki:
  borowik:
    nazwa: borowik szlachetny
    lacina: Boletus edulis
    gbif: [Boletus edulis]
    zywiciele: {ŚW: 1.0, SO: 1.0, SO.WE: 0.5, BK: 1.0, DB: 1.0, DB.C: 0.5, BRZ: 0.5, GB: 0.3, JD: 0.8}
    nasycenie: 0.6
    wiek: [[0, 0], [10, 0.05], [20, 0.3], [40, 1.0]]
    siedliska: &bory_lasy_swieze
      BŚW: 1.0
      BMŚW: 1.0
      LMŚW: 1.0
      LŚW: 1.0
      BMW: 0.9          # plan: „bory mieszane, lasy mieszane” – wariant wilgotny lekko niżej
      LMW: 0.9
      BW: 0.5
      LW: 0.4
      BS: 0.4
      LŁ: 0.15
      BB: 0.1
      BMB: 0.1
      LMB: 0.1
      OL: 0.1
      OLJ: 0.1
    sezon: {6: 1, 7: 1, 8: 1, 9: 1, 10: 1}

  podgrzybek:
    nazwa: podgrzybek brunatny
    lacina: Imleria badia
    gbif: [Imleria badia]
    zywiciele: {SO: 1.0, SO.WE: 0.7, ŚW: 1.0, MD: 0.3}
    nasycenie: 0.5
    wiek: [[0, 0], [10, 0.1], [20, 1.0]]
    siedliska:
      BŚW: 1.0
      BMŚW: 1.0
      BW: 1.0
      BMW: 1.0
      LMŚW: 0.6
      LMW: 0.5
      BS: 0.5
      LŚW: 0.3
      LW: 0.3
      LŁ: 0.1
      BB: 0.15
      BMB: 0.15
      LMB: 0.1
      OL: 0.1
      OLJ: 0.1
    sezon: {8: 1, 9: 1, 10: 1, 11: 1}

  kozlarz_babka:
    nazwa: koźlarz babka
    lacina: Leccinum scabrum
    gbif: [Leccinum scabrum]
    zywiciele: {BRZ: 1.0}
    nasycenie: 0.3           # brzoza jako domieszka 30% wystarcza do pełnej wartości
    min_obecnosc: 0.4        # brzoza choćby pojedynczo (MJS/PJD) – co najmniej 0,4 (umiarkowany)
    wiek: [[0, 0], [5, 0.5], [10, 1.0]]
    siedliska:
      BŚW: 1.0
      BMŚW: 1.0
      LMŚW: 1.0
      LŚW: 1.0
      BW: 0.9
      BMW: 0.9
      LMW: 0.9
      LW: 0.8
      BS: 0.6
      LŁ: 0.2
      BB: 0.2
      BMB: 0.2
      LMB: 0.2
      OL: 0.15
      OLJ: 0.1
    sezon: {6: 1, 7: 1, 8: 1, 9: 1, 10: 1}

  kozlarz_czerwony:
    nazwa: koźlarz czerwony
    lacina: Leccinum aurantiacum
    gbif: [Leccinum aurantiacum]
    zywiciele: {OS: 1.0, TP: 0.5}
    nasycenie: 0.2           # osika zwykle występuje jako domieszka
    min_obecnosc: 0.4        # 85% wystąpień osiki w BDL to MJS/PJD
    wiek: [[0, 0], [5, 0.5], [10, 1.0]]
    siedliska:
      LŚW: 1.0
      LMŚW: 1.0
      BMŚW: 1.0
      LW: 0.9
      LMW: 0.9
      BMW: 0.8
      BŚW: 0.7
      BW: 0.6
      BS: 0.3
      LŁ: 0.2
      BB: 0.1
      BMB: 0.15
      LMB: 0.15
      OL: 0.1
      OLJ: 0.1
    sezon: {6: 1, 7: 1, 8: 1, 9: 1, 10: 1}

  maslak:
    nazwa: maślak zwyczajny
    lacina: Suillus luteus
    gbif: [Suillus luteus]
    zywiciele: {SO: 1.0, SO.WE: 0.3}
    nasycenie: 0.6
    wiek: [[0, 0], [5, 0.3], [10, 1.0], [30, 1.0], [40, 0.5], [60, 0.2], [80, 0.1]]
    siedliska:
      BS: 1.0
      BŚW: 1.0
      BMŚW: 0.6
      BW: 0.4
      BMW: 0.3
      LMŚW: 0.3
      LŚW: 0.2
      LMW: 0.2
      LW: 0.1
      BB: 0.1
      BMB: 0.1
      LMB: 0.1
      OL: 0.05
      OLJ: 0.05
      LŁ: 0.05
    sezon: {6: 1, 7: 1, 8: 1, 9: 1, 10: 1, 11: 1}

  rydz:
    nazwa: rydz (mleczaj rydz / świerkowy)
    lacina: Lactarius deliciosus / L. deterrimus
    gbif: [Lactarius deliciosus, Lactarius deterrimus]
    zywiciele: {SO: 1.0, SO.WE: 0.0, ŚW: 1.0}   # L. deliciosus z sosnami dwuigielnymi, L. deterrimus ze świerkiem
    nasycenie: 0.5
    wiek: [[0, 0], [5, 0.3], [10, 1.0], [30, 1.0], [40, 0.5], [60, 0.2], [80, 0.1]]
    siedliska:
      BŚW: 1.0
      BMŚW: 1.0
      BS: 0.6
      BW: 0.5
      BMW: 0.5
      LMŚW: 0.5
      LŚW: 0.3
      LMW: 0.3
      LW: 0.2
      BB: 0.1
      BMB: 0.1
      LMB: 0.1
      OL: 0.05
      OLJ: 0.05
      LŁ: 0.05
    sezon: {8: 1, 9: 1, 10: 1}

  kurka:
    nazwa: pieprznik jadalny (kurka)
    lacina: Cantharellus cibarius
    gbif: [Cantharellus cibarius]
    zywiciele: {SO: 1.0, SO.WE: 0.5, ŚW: 1.0, BK: 1.0, DB: 1.0, DB.C: 0.3, GB: 0.3, BRZ: 0.3}
    nasycenie: 0.6
    wiek: [[0, 0], [10, 0.1], [20, 1.0]]
    siedliska:              # ubogie, kwaśne siedliska borowe i mieszane
      BŚW: 1.0
